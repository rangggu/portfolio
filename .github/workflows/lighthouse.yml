name: Lighthouse CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # 측정 전용 빌드: 샘플 글(draft)을 포함한다. 배포 빌드에는 SHOW_DRAFTS를 주지 않는다
      - name: Build (초안 포함)
        run: yarn build
        env:
          SHOW_DRAFTS: 'true'

      - name: Lighthouse (mobile, desktop × 3회)
        id: lhci
        run: |
          status=0
          for preset in mobile desktop; do
            export LIGHTHOUSE_FORM_FACTOR="$preset"
            rm -rf .lighthouseci
            yarn lhci collect || status=1
            yarn lhci upload || echo "업로드 실패 (리포트 링크 없음)"
            yarn lhci assert || status=1
            mkdir -p "lhci-results/$preset"
            cp .lighthouseci/*.json "lhci-results/$preset/" 2>/dev/null || true
          done
          node scripts/lhci-summary.mjs mobile=lhci-results/mobile desktop=lhci-results/desktop > lhci-summary.md
          cat lhci-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: PR에 점수·리포트 링크 남기기
        if: always() && github.event_name == 'pull_request' && hashFiles('lhci-summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- lighthouse-ci -->';
            const body = `${marker}\n## Lighthouse CI\n\n${fs.readFileSync('lhci-summary.md', 'utf8')}\n\n기준: 각 카테고리 0.9 이상 (접근성은 1.0 미만이면 경고). 리포트 링크는 임시 공개 저장소라 며칠 뒤 만료됩니다.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lhci-results/
          if-no-files-found: ignore

      - name: 기준 미달이면 실패
        if: steps.lhci.outputs.status != '0'
        run: exit 1
